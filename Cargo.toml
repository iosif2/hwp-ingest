[workspace]
members = [
    "crates/hwp-ingest",
    "crates/hwp-ingest-rhwp-adapter",
    "crates/hwp-ingest-python",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
hwp-ingest = { path = "crates/hwp-ingest" }
hwp-ingest-rhwp-adapter = { path = "crates/hwp-ingest-rhwp-adapter" }
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
rhwp = { path = "vendor/rhwp-subset", default-features = false }
