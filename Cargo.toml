[workspace]
members = [
    "crates/hwp-ingest",
    "crates/hwp-ingest-python",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
hwp-ingest = { path = "crates/hwp-ingest" }
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
rhwp = { git = "https://github.com/edwardkim/rhwp", tag = "v0.7.17", default-features = false }
